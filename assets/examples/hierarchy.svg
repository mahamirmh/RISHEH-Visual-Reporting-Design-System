<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-title svg-description" aria-label="Visual hierarchy realistic educational example"><title id="svg-title">hierarchy — illustrated educational example</title><desc id="svg-description">A synthetic Ava reporting example demonstrating hierarchy. The accompanying Persian lesson explains the values and layout.</desc><rect width="900" height="550" fill="#FAFBF9"/><text x="60" y="75" font-size="33" fill="#12304A" font-family="Arial">VISUAL HIERARCHY</text><text x="60" y="107" font-size="17" fill="#738781" font-family="Arial">Finding first, evidence second, detail third</text><text x="120" y="200" font-size="42" fill="#174A3A" font-family="Arial">Requests increased to 24</text><text x="120" y="245" font-size="17" fill="#879594" font-family="Arial">MAIN FINDING</text><path d="M120 270H760" stroke="#D9E6DE" stroke-width="2"/><rect x="200" y="352" width="85" height="48" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><rect x="330" y="328" width="85" height="72" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><rect x="460" y="304" width="85" height="96" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><text x="615" y="405" font-size="20" fill="#12304A" font-family="Arial">Evidence → detail</text><text x="60" y="510" font-size="15" fill="#174A3A" font-family="Arial">RISHEH ACADEMY · FICTIONAL AVA EXAMPLE</text></svg>