<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-title svg-description" aria-label="Regression test detailed visual example"><title id="svg-title">regression — illustrated educational example</title><desc id="svg-description">A synthetic Ava reporting example demonstrating regression. The accompanying Persian lesson explains the values and layout.</desc><rect width="900" height="550" fill="#FAFBF9"/><text x="60" y="77" font-size="33" fill="#12304A" font-family="Arial">REGRESSION TEST</text><text x="60" y="110" font-size="18" fill="#6E807A" font-family="Arial">Duplicate ID bug fixed and tested</text><rect x="135" y="155" width="275" height="270" rx="10" fill="#F9EAE5" stroke="#D5E1DB"/><rect x="490" y="155" width="275" height="270" rx="10" fill="#E6F1E9" stroke="#D5E1DB"/><text x="165" y="200" font-size="24" fill="#12304A" font-family="Arial">BEFORE</text><text x="520" y="200" font-size="24" fill="#12304A" font-family="Arial">AFTER + TEST</text><text x="165" y="270" font-size="21" fill="#12304A" font-family="Arial">Duplicate IDs</text><text x="165" y="330" font-size="23" fill="#A84E39" font-family="Arial">Accepted  ✕</text><text x="520" y="270" font-size="21" fill="#12304A" font-family="Arial">Duplicate IDs</text><text x="520" y="330" font-size="23" fill="#174A3A" font-family="Arial">Rejected  ✓</text><text x="60" y="510" font-size="15" fill="#174A3A" font-family="Arial">RISHEH ACADEMY · SYNTHETIC EXAMPLE</text></svg>