<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title description"><title id="title">Flowchart: concrete example</title><desc id="description">What happens when a form is submitted?. Synthetic educational data, not a real client.</desc><rect width="900" height="540" fill="#FAFAF7"/><rect x="25" y="25" width="850" height="490" rx="20" fill="none" stroke="#D6E2DC" stroke-width="2"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="31" fill="#12304A" text-anchor="start">FLOWCHART</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="16" fill="#63737B" text-anchor="start">What happens when a form is submitted?</text><rect x="80" y="210" width="200" height="95" rx="12" fill="#FFFFFF" stroke="#C7D8D0"/><text x="98" y="240" font-family="Arial,sans-serif" font-size="17" fill="#12304A" text-anchor="start">Submit form</text><path d="M455 175L580 260L455 345L330 260Z" fill="#F0E3D1" stroke="#A88455" stroke-width="3"/><text x="455" y="266" font-family="Arial,sans-serif" font-size="24" fill="#12304A" text-anchor="middle">Valid?</text><path d="M280 260 L330 260" stroke="#174A3A" stroke-width="3" fill="none"/><path d="M580 260 L640 260" stroke="#174A3A" stroke-width="3" fill="none"/><rect x="640" y="210" width="200" height="95" rx="12" fill="#FFFFFF" stroke="#C7D8D0"/><text x="658" y="240" font-family="Arial,sans-serif" font-size="17" fill="#12304A" text-anchor="start">Save request</text><text x="585" y="242" font-family="Arial,sans-serif" font-size="16" fill="#12304A" text-anchor="start">YES</text><path d="M455 345 L455 395" stroke="#174A3A" stroke-width="3" fill="none"/><text x="468" y="390" font-family="Arial,sans-serif" font-size="17" fill="#12304A" text-anchor="start">NO: show errors</text><text x="60" y="495" font-family="Arial,sans-serif" font-size="15" fill="#174A3A" text-anchor="start">AVA / FICTIONAL LEARNING EXAMPLE</text></svg>