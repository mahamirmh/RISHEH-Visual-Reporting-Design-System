<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-title svg-description" aria-label="Progressive disclosure realistic educational example"><title id="svg-title">disclosure — illustrated educational example</title><desc id="svg-description">A synthetic Ava reporting example demonstrating disclosure. The accompanying Persian lesson explains the values and layout.</desc><rect width="900" height="550" fill="#FAFBF9"/><text x="60" y="75" font-size="33" fill="#12304A" font-family="Arial">PROGRESSIVE DISCLOSURE</text><text x="60" y="107" font-size="17" fill="#738781" font-family="Arial">Chart summary expands to a data table</text><rect x="135" y="145" width="630" height="320" rx="10" fill="#fff" stroke="#D5E1DB"/><text x="165" y="194" font-size="23" fill="#12304A" font-family="Arial">Monthly requests</text><rect x="240" y="300" width="75" height="48" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><rect x="365" y="276" width="75" height="72" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><rect x="490" y="252" width="75" height="96" rx="10" fill="#5FAF80" stroke="#D5E1DB"/><rect x="170" y="390" width="555" height="48" rx="10" fill="#E2F0E8" stroke="#D5E1DB"/><text x="188" y="421" font-size="17" fill="#12304A" font-family="Arial">▼  View table: April 12 · May 18 · June 24</text><text x="60" y="510" font-size="15" fill="#174A3A" font-family="Arial">RISHEH ACADEMY · FICTIONAL AVA EXAMPLE</text></svg>