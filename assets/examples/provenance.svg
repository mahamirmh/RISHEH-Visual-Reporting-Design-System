<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="svg-title svg-description" aria-label="Data provenance detailed visual example"><title id="svg-title">provenance — illustrated educational example</title><desc id="svg-description">A synthetic Ava reporting example demonstrating provenance. The accompanying Persian lesson explains the values and layout.</desc><rect width="900" height="550" fill="#FAFBF9"/><text x="60" y="77" font-size="33" fill="#12304A" font-family="Arial">DATA PROVENANCE</text><text x="60" y="110" font-size="18" fill="#6E807A" font-family="Arial">Where did the number 24 come from?</text><rect x="95" y="170" width="205" height="250" rx="10" fill="#EDF4EF" stroke="#D5E1DB"/><text x="120" y="215" font-size="22" fill="#12304A" font-family="Arial">SOURCE CSV</text><text x="120" y="265" font-size="18" fill="#12304A" font-family="Arial">Apr: 12</text><text x="120" y="305" font-size="18" fill="#12304A" font-family="Arial">May: 18</text><text x="120" y="345" font-size="18" fill="#12304A" font-family="Arial">Jun: 24</text><path d="M300 300H365M580 300H635" stroke="#C5A16D" stroke-width="5"/><rect x="365" y="210" width="215" height="160" rx="10" fill="#E9F0E9" stroke="#D5E1DB"/><text x="395" y="255" font-size="23" fill="#12304A" font-family="Arial">Validate</text><text x="395" y="305" font-size="17" fill="#12304A" font-family="Arial">Remove duplicates</text><rect x="635" y="210" width="170" height="160" rx="10" fill="#174A3A" stroke="#D5E1DB"/><text x="668" y="270" font-size="58" fill="white" font-family="Arial">24</text><text x="658" y="317" font-size="16" fill="white" font-family="Arial">June requests</text><text x="60" y="510" font-size="15" fill="#174A3A" font-family="Arial">RISHEH ACADEMY · SYNTHETIC EXAMPLE</text></svg>