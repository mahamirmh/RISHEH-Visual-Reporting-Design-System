<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title description"><title id="title">Brief: concrete example</title><desc id="description">A request becomes a usable project brief. Synthetic educational data, not a real client.</desc><rect width="900" height="540" fill="#FAFAF7"/><rect x="25" y="25" width="850" height="490" rx="20" fill="none" stroke="#D6E2DC" stroke-width="2"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="31" fill="#12304A" text-anchor="start">BRIEF</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="16" fill="#63737B" text-anchor="start">A request becomes a usable project brief</text><rect x="70" y="125" width="780" height="310" rx="12" fill="#FFFFFF" stroke="#C7D8D0"/><text x="88" y="155" font-family="Arial,sans-serif" font-size="17" fill="#12304A" text-anchor="start">PROJECT BRIEF  /  Ava reporting demo</text><text x="110" y="215" font-family="Arial,sans-serif" font-size="23" fill="#12304A" text-anchor="start">Audience: Product manager</text><text x="110" y="260" font-family="Arial,sans-serif" font-size="23" fill="#12304A" text-anchor="start">Question: Are requests increasing?</text><text x="110" y="305" font-family="Arial,sans-serif" font-size="23" fill="#12304A" text-anchor="start">Evidence: 12 → 18 → 24 monthly requests</text><rect x="110" y="345" width="390" height="48" rx="10" fill="#174A3A" stroke="none"/><text x="130" y="376" font-family="Arial,sans-serif" font-size="19" fill="white" text-anchor="start">Deliverable: Mobile report + table</text><text x="60" y="495" font-family="Arial,sans-serif" font-size="15" fill="#174A3A" text-anchor="start">AVA / FICTIONAL LEARNING EXAMPLE</text></svg>