name: Education visual release QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/examples/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/education-*.mjs'
      - 'package.json'
jobs:
  education-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:education
      - run: npm run qa:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-visual-qa-screenshots
          path: test-results/education-visual/
          retention-days: 14
